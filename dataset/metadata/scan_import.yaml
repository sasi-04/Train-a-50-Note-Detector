# Provenance + manual split for the 72-page phone-scan PDF supplied by the developer
# ("Scan documents20261026_120030.pdf", one genuine note per denomination, photographed by the developer).
# Used by scripts/import_scan_pdf.py. Pages are 1-based. Images are rotated to upright (landscape) on import.
#
# SPLIT RATIONALE (read before trusting any number computed from it):
#   The 72 pages are ~15 clusters of near-identical shots of ONE physical note per denomination. A random or
#   per-image split would leak. Whole clusters (and the blue-table shots) are therefore assigned to one split.
#   Every negative denomination keeps one side in train; the other side is held out in val or test.
#   Consequence: val has 1 target image and test has 2 (both small-on-blue-table). These evaluations are
#   anecdotal, not statistical. The shipped model is a separate fit on all images (see docs/EVALUATION.md).
rotate: ccw
source: phone
note: "document-scanner-app capture of the developer's own genuine note; auto-cropped, pdf page"
pages:
  # --- Rs.10 -----------------------------------------------------------------------------------
  - {pages: [1, 7, 8, 9],            denomination: "10",  side: front, session: scan_train,      split: train, background: unknown}
  - {pages: [6],                     denomination: "10",  side: front, session: scan_val,        split: val,   background: unknown}
  - {pages: [3, 4, 5, 10, 11, 12],   denomination: "10",  side: back,  session: scan_val,        split: val,   background: unknown}
  - {pages: [2],                     denomination: "10",  side: back,  session: scan_test_blue,  split: test,  background: plain}
  # --- Rs.20 -----------------------------------------------------------------------------------
  - {pages: [13, 15, 16, 17, 18],    denomination: "20",  side: front, session: scan_test_crop,  split: test,  background: unknown}
  - {pages: [14],                    denomination: "20",  side: front, session: scan_test_blue,  split: test,  background: plain}
  - {pages: [20, 22, 23, 24],        denomination: "20",  side: back,  session: scan_train,      split: train, background: unknown}
  - {pages: [19, 21],                denomination: "20",  side: back,  session: scan_test_blue,  split: test,  background: plain}
  # --- new Rs.50 (TARGET) ----------------------------------------------------------------------
  - {pages: [25, 27, 28, 29],        denomination: "50_new", side: front, session: scan_train,   split: train, background: unknown}
  - {pages: [26],                    denomination: "50_new", side: front, session: scan_test_blue, split: test, background: plain}
  - {pages: [30, 31, 32, 35],        denomination: "50_new", side: back,  session: scan_train,   split: train, background: unknown}
  - {pages: [34],                    denomination: "50_new", side: back,  session: scan_val,     split: val,   background: unknown}
  - {pages: [33],                    denomination: "50_new", side: back,  session: scan_test_blue, split: test, background: plain}
  # --- Rs.100 ----------------------------------------------------------------------------------
  - {pages: [36, 37, 38, 39, 40, 41, 42, 43], denomination: "100", side: back,  session: scan_val,   split: val,   background: unknown}
  - {pages: [44, 45, 46, 47, 48, 49, 50],     denomination: "100", side: front, session: scan_train, split: train, background: unknown}
  # --- Rs.200 ----------------------------------------------------------------------------------
  - {pages: [51, 52, 53, 54, 55, 56],         denomination: "200", side: front, session: scan_test_crop, split: test, background: unknown}
  - {pages: [57, 58, 59, 61, 62],             denomination: "200", side: back,  session: scan_train,     split: train, background: unknown}
  - {pages: [60],                             denomination: "200", side: back,  session: scan_val,       split: val,   background: unknown}
  # --- Rs.500 ----------------------------------------------------------------------------------
  - {pages: [63, 64, 65, 66, 67],             denomination: "500", side: front, session: scan_train, split: train, background: unknown}
  - {pages: [68, 69, 70, 71, 72],             denomination: "500", side: back,  session: scan_val,   split: val,   background: unknown}
