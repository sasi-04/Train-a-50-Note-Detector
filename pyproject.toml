[project]
name = "rs50-vision"
version = "0.1.0"
description = "Real-time detection of the new Indian Rs.50 banknote (YOLOv8n -> ONNX -> OpenCV)"
requires-python = ">=3.10"
dependencies = ["opencv-python>=4.8,<6", "numpy>=1.24", "PyYAML>=6.0", "Pillow>=10.0"]

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
testpaths = ["tests"]
markers = [
    "slow: builds/exports a model with PyTorch (needs requirements-train.txt)",
    "real_model: needs a trained model.onnx and real dataset images; skipped otherwise",
]
addopts = "-ra"
